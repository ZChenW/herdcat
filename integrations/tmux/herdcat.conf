# Named array entries preserve other global hooks, including user hooks at [0].
set-hook -g window-pane-changed[7313] 'run-shell -b "TMUX_PANE=#{pane_id} herdcat --pane #{client_pid} #{s/%//:pane_id} >/dev/null 2>&1"'
set-hook -g session-window-changed[7313] 'run-shell -b "TMUX_PANE=#{pane_id} herdcat --pane #{client_pid} #{s/%//:pane_id} >/dev/null 2>&1"'
set-hook -g client-session-changed[7313] 'run-shell -b "TMUX_PANE=#{pane_id} herdcat --pane #{client_pid} #{s/%//:pane_id} >/dev/null 2>&1"'
