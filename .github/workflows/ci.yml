name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libwayland-dev wayland-protocols \
            libfreetype-dev libfontconfig1-dev fonts-dejavu-core fonts-noto-core \
            fonts-noto-cjk fonts-liberation \
            python3 clang-format clang-tidy clang-tools shellcheck

      - name: Check formatting
        run: make format-check

      - name: Build release
        run: make release

      - name: Build debug (ASan + UBSan)
        run: make clean && make debug

      - name: Run tests
        run: make test-sanitize

      - name: Run clang-tidy
        run: make lint

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run scan-build
        run: scan-build --status-bugs --exclude lib make clean release

  # The runtime tests drive a small test compositor. It needs libwayland
  # 1.23 or newer, which the Ubuntu runner does not have, so they run in an
  # Arch container, as an ordinary user like the program itself.
  runtime:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git wayland \
            wayland-protocols freetype2 fontconfig python sway \
            noto-fonts noto-fonts-cjk ttf-dejavu ttf-liberation

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Run runtime tests
        run: |
          useradd -m tester
          chown -R tester .
          su tester -c 'HERDCAT_REQUIRE_SWAY=1 XDG_RUNTIME_DIR=$(mktemp -d) make test-runtime'

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Check flake and package
        run: ./scripts/test_nix_build.sh
